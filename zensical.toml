# ============================================================================
# Foley的笔记 —— Zensical 配置
# 文档：https://zensical.org/docs/
# 网站结构、配色与写作约定见仓库根目录 CLAUDE.md
# ============================================================================

[project]
site_name = "Foley的笔记"
site_url = "https://notes.leyuanwang.tech/"
site_description = "Foley 的个人知识库：量子信息笔记、概念速查与兴趣探索。"
site_author = "Foley"
copyright = "Copyright &copy; 2026 Foley"

repo_url = "https://github.com/foley71047/notes"
repo_name = "foley71047/notes"

docs_dir = "docs"
site_dir = "site"

# 导航：由 docs/.nav.yml 定义顶部五个标签页（awesome-nav 插件）。
# 新增、删除笔记或概念只需要增删 docs/notes/、docs/concepts/ 里的 md 文件，不用改这个文件。

# 这些文件改动时整站重新生成（笔记列表、标签页、"引用本概念的笔记"都依赖它们）
watch = ["docs/notes", "docs/concepts", "scripts/site_data.py"]

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/site.js",
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

# ----------------------------------------------------------------------------
# 主题
# ----------------------------------------------------------------------------
[project.theme]
language = "zh"
custom_dir = "overrides"          # 模板覆盖：信息栏与自动列表的插入位置
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# 正文与代码字体由 Google Fonts 加载；标题衬线字体在 extra.css 中加载。
[project.theme.font]
text = "Noto Sans SC"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.icon.tag]
default = "lucide/hash"

# 配色切换：跟随系统（默认）→ 浅色 → 深色 → 跟随系统……，选择会自动记住。
# 具体色值在 docs/stylesheets/extra.css 中覆盖。toggle.name 是"点击后切换到"的状态。
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "当前：跟随系统（点击切换到浅色）"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "当前：浅色（点击切换到深色）"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "当前：深色（点击切换到跟随系统）"

# ----------------------------------------------------------------------------
# 页脚与标签分组
# ----------------------------------------------------------------------------
[project.extra]
generator = false

# 可选：标签页上的分组。只影响显示位置，不需要先登记——
# 笔记里写的任何标签都会自动出现，不在这里的归到"其他"；组内按篇数排序。
[project.extra.tag_groups]
"主题" = ["纠缠", "Bell 非局域性", "导引", "器件无关", "相干性", "资源理论", "量子测量", "量子态层析", "线性光学"]
"方法" = ["数值优化", "半定规划"]
"兴趣" = ["量化"]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/foley71047"
name = "GitHub"

[[project.extra.social]]
icon = "lucide/house"
link = "https://leyuanwang.tech"
name = "Homepage · leyuanwang.tech"

# ----------------------------------------------------------------------------
# 插件
# ----------------------------------------------------------------------------
# 导航：docs/.nav.yml 定义顶部标签页，目录里的新文件自动收录
[project.plugins.awesome-nav]

# 目录级 front matter：docs/notes/.meta.yml、docs/concepts/.meta.yml
[project.plugins.meta]

# 标签：front matter 里的 tags 进入搜索；标签页本身由 scripts/site_data.py 生成
[project.plugins.tags]

# 站点数据：渲染每页前运行 scripts/site_data.py 的 define_env()，生成列表、信息栏、
# 标签页和"引用本概念的笔记"。正文里不使用宏，所以把宏语法换成不会出现的写法，
# 避免 LaTeX 里的 {{ }}、{# } 被当成模板。
[project.plugins.macros]
module_name = "scripts/site_data"
j2_variable_start_string = "{fl{"
j2_variable_end_string = "}fl}"
j2_block_start_string = "{fl%"
j2_block_end_string = "%fl}"
j2_comment_start_string = "{fl#"
j2_comment_end_string = "#fl}"

# 搜索：默认开启。按中文标点和空白切分词项，配合搜索引擎自身的 CJK 处理
[project.plugins.search]
separator = '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])|[，。！？、；：“”‘’（）《》【】]+'

# ----------------------------------------------------------------------------
# Markdown 扩展
# ----------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
# 悬停预览：正文里指向概念词条的链接，鼠标悬停时显示词条开头（英文名 + 陈述 / 定义框）
"zensical.extensions.preview".targets.include = ["concepts/*.md"]
"zensical.extensions.preview".targets.exclude = ["concepts/index.md"]
