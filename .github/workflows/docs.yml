# 构建并部署网站到 GitHub Pages
# - 推送到 main：构建（严格模式，有失效链接即失败）并部署
# - 其他分支 / Pull Request：只构建检查，不部署
name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史来计算"最后更新"时间
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - name: 生成"最后更新"与"最近更新"
        run: python scripts/site_meta.py --stamp
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
